# Development dependencies for future stages (Mongoose persistence, BullMQ queue).
# The MVP runs without these: the API persists to DATA_DIR and runs jobs in-process.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  mongo_data:
