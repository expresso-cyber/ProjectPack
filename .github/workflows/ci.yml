name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # the api/web workspaces typecheck against @projectpack/shared's
      # compiled dist/ — it must be built before any typecheck or test runs
      - run: npm run build -w @projectpack/shared
      - run: npm run install:python
      - run: npm run typecheck
      - run: npm run test:python
      - run: npm run test:api
      - run: npm run build
